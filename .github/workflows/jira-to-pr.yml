name: JIRA → Claude → PR

# Triggered by a webhook (GitHub repository_dispatch) or manually.
#
# Webhook usage — have JIRA (or any system) POST to the GitHub REST API:
#
#   curl -X POST \
#     -H "Accept: application/vnd.github+json" \
#     -H "Authorization: Bearer <GITHUB_TOKEN_WITH_REPO_SCOPE>" \
#     https://api.github.com/repos/vlucas/ai-github-workflow/dispatches \
#     -d '{
#           "event_type": "jira-ticket",
#           "client_payload": {
#             "key": "PROJ-123",
#             "summary": "Optional summary (fetched from JIRA if omitted)",
#             "description": "Optional description (fetched from JIRA if omitted)"
#           }
#         }'
#
# Status flow:
#   - Work only starts when the ticket is in REQUIRED_STATUS
#     ("Selected for Development"). This guard prevents the workflow from
#     re-triggering itself in a loop when it changes the ticket's status.
#   - When work begins the ticket is moved to IN_PROGRESS_STATUS ("In Progress").
#   - When a PR is opened the ticket is moved to DONE_STATUS ("Dev Review").
#
# If only "key" is supplied, the workflow fetches the summary and description
# from the JIRA REST API using the JIRA_* secrets below.
#
# Required repository secrets:
#   ANTHROPIC_API_KEY  - Anthropic API key for Claude Code
#   JIRA_BASE_URL      - e.g. https://your-org.atlassian.net
#   JIRA_EMAIL         - Atlassian account email
#   JIRA_API_TOKEN     - Atlassian API token

on:
  repository_dispatch:
    types: [jira-ticket]
  workflow_dispatch:
    inputs:
      key:
        description: "JIRA ticket key (e.g. PROJ-123)"
        required: true
        type: string
      summary:
        description: "Ticket summary (optional, fetched from JIRA if blank)"
        required: false
        type: string
      description:
        description: "Ticket description (optional, fetched from JIRA if blank)"
        required: false
        type: string
      force:
        description: "Bypass the status guard (for manual testing)"
        required: false
        default: false
        type: boolean

concurrency:
  # One run per ticket. cancel-in-progress is false on purpose: the workflow
  # changes the ticket's status, which can re-trigger a dispatch for the same
  # ticket — we must not cancel an in-flight implementation. The duplicate run
  # is harmless, as the status guard makes it skip.
  group: jira-to-pr-${{ github.event.client_payload.key || inputs.key }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  REQUIRED_STATUS: "Selected for Development"
  IN_PROGRESS_STATUS: "In Progress"
  DONE_STATUS: "Dev Review"

jobs:
  # Loop-prevention gate: only proceed when the ticket is in REQUIRED_STATUS.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard on ticket status
        id: guard
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET_KEY: ${{ github.event.client_payload.key || inputs.key }}
          REQUIRED_STATUS: ${{ env.REQUIRED_STATUS }}
          FORCE: ${{ inputs.force }}
        run: .github/scripts/jira-status.sh

  implement:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Mark ticket In Progress
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET_KEY: ${{ github.event.client_payload.key || inputs.key }}
          TARGET_STATUS: ${{ env.IN_PROGRESS_STATUS }}
        run: .github/scripts/jira-transition.sh

      - name: Resolve ticket details
        id: ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          INPUT_KEY: ${{ github.event.client_payload.key || inputs.key }}
          INPUT_SUMMARY: ${{ github.event.client_payload.summary || inputs.summary }}
          INPUT_DESCRIPTION: ${{ github.event.client_payload.description || inputs.description }}
        run: .github/scripts/resolve-ticket.sh

      - name: Create working branch
        env:
          BRANCH: ${{ steps.ticket.outputs.branch }}
        run: .github/scripts/create-branch.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Claude Code agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TICKET_KEY: ${{ steps.ticket.outputs.key }}
          TICKET_SUMMARY: ${{ steps.ticket.outputs.summary }}
          TICKET_DESCRIPTION: ${{ steps.ticket.outputs.description }}
        run: .github/scripts/run-claude.sh

      - name: Check for changes
        id: diff
        env:
          TICKET_KEY: ${{ steps.ticket.outputs.key }}
        run: .github/scripts/check-changes.sh

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.ticket.outputs.branch }}
          TICKET_KEY: ${{ steps.ticket.outputs.key }}
          TICKET_SUMMARY: ${{ steps.ticket.outputs.summary }}
        run: .github/scripts/commit-and-push.sh

      - name: Verify (typecheck, lint, tests, build)
        id: verify
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        env:
          VERIFY_REPORT: ${{ runner.temp }}/verify-report.md
        run: .github/scripts/verify.sh

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.ticket.outputs.branch }}
          TICKET_KEY: ${{ steps.ticket.outputs.key }}
          TICKET_SUMMARY: ${{ steps.ticket.outputs.summary }}
          TICKET_DESCRIPTION: ${{ steps.ticket.outputs.description }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          VERIFY_REPORT: ${{ runner.temp }}/verify-report.md
          VERIFY_PASSED: ${{ steps.verify.outputs.passed }}
        run: .github/scripts/open-pr.sh

      - name: Mark ticket Dev Review
        if: steps.diff.outputs.changed == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TICKET_KEY: ${{ steps.ticket.outputs.key }}
          TARGET_STATUS: ${{ env.DONE_STATUS }}
        run: .github/scripts/jira-transition.sh

      - name: Fail run if checks failed
        if: steps.diff.outputs.changed == 'true' && steps.verify.outputs.passed != 'true'
        run: |
          echo "::error::Post-implementation checks failed for ${{ steps.ticket.outputs.key }}. PR opened for review."
          exit 1
